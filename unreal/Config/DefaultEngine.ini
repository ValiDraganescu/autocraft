[/Script/Engine.RendererSettings]
; The user's choice (2026-10-05): their M4 Max only, best quality.
; Fully dynamic: maps are generated at runtime, nothing is baked.
r.AllowStaticLighting=False
; Lumen global illumination and reflections (software tracing on mesh
; distance fields). Hardware ray tracing works on 5.8 Metal SM6 (it needs
; r.RayTracing and r.SkinCache.CompileShaders) but was measured (2026-10-05,
; 5120x1378, night base/fight and noon) at +1 ms GPU and +700 MB for no visible
; change: the lamps cast no shadows, so nothing needs the ray-traced scene.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.HardwareRayTracing=False
; Virtual shadow maps, Nanite. MegaLights off: without hardware ray tracing
; it only warns on screen, and the lamp pool (C6, AcLamps) budgets its 96
; unshadowed lamps itself; the frames are the same with it off.
r.Shadow.Virtual.Enable=1
r.Nanite.ProjectEnabled=True
r.MegaLights.EnableForProject=False
; Deferred shading, TSR, no MSAA.
r.ForwardShading=False
r.AntiAliasingMethod=4
r.MSAACount=1
; The outline pass (AcOutline.h, M_AcOutline) reads custom stencil values: 3 is the
; mode that writes them (the placement hologram already used custom depth).
r.CustomDepth=3
; The Swift game has no motion blur; panning a top-down map smears with it.
r.DefaultFeature.MotionBlur=False

[/Script/MacTargetPlatform.MacTargetSettings]
; Metal SM6 only: Nanite needs it (Mac SM5 has no Nanite), and one shader
; platform halves the shader compiles.
!TargetedRHIs=ClearArray
+TargetedRHIs=SF_METAL_SM6
; Voices: wind, a drill per working Prospector on screen, hums, 6 mini guns,
; and the 22 one-shot voices of UAcAudioDirector (the default is 32).
AudioMaxChannels=96

[BuildConfiguration]
; Agents build while the editor is open; no hot reload into it (no toasts, no numbered dylibs).
bAllowHotReloadFromIDE=False

[SystemSettings]
; P2 (GPU, 2026-10-05): the 60 fps budget at 5120x1378 on the M4 Max. Each
; was measured interleaved against the one before (`bench.py --gpu
; --variant`) and checked side by side at 5K (scratchpad ue/p2gpu). These
; override the scalability levels (sg.* = Epic). The auto screen percentage
; (r.ScreenPercentage.Default.Desktop.Mode) already renders 5K at ~52%.
; TSR history at the output size, not 2x it (Epic's 200 makes a
; 10240x2756 history at 5K): -2 ms in a fight, no visible change.
r.TSR.History.ScreenPercentage=100
r.TSR.History.UpdateQuality=2
; The volumetric clouds' view rays: 32 steps (default 768, clamped by
; distance) cost 2 ms instead of 5.5 ms when the pilot looks at the sky;
; the clouds keep their shapes (a little grainier up close).
r.VolumetricCloud.ViewRaySampleMaxCount=32
; Clouds in the real-time sky-light capture at a quarter (default half)
; resolution; and one capture face a frame (default 2): -0.6 ms.
r.SkyLight.RealTimeReflectionCapture.VolumetricCloudResolutionDivider=4
r.SkyLight.RealTimeReflectionCapture.TimeSlice.SkyCloudCubeFacePerFrame=1
; Lumen screen probes every 32 pixels (High; Epic 16) and the volumetric
; fog grid at 16 pixels (High; Epic 8): ~-0.8 ms together, the same frames
; at 5K. Units stay out of the distance-field scene (ac.RenderUnitDistanceFields).
r.Lumen.ScreenProbeGather.DownsampleFactor=32
r.VolumetricFog.GridPixelSize=16

[Audio]
; Keep playing when the window loses focus (the engine default 0 mutes it); the game only falls quiet when paused.
UnfocusedVolumeMultiplier=1.0
