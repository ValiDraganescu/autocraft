<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
body{width:2000px;height:800px;position:relative}
.bg{position:absolute;inset:0;background:url(bg.jpg) no-repeat;background-size:1700px auto;background-position:420px -150px}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,var(--ink) 0,var(--ink) 30%,rgba(6,18,30,.85) 42%,rgba(6,18,30,0) 62%)}
.bottom{position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,18,30,.7) 0,rgba(6,18,30,0) 30%)}
.txt{position:absolute;left:90px;top:96px;display:flex;flex-direction:column;gap:22px}
.name{font-family:Exo;font-weight:900;font-size:64px;letter-spacing:2px;color:var(--cyan)}
h1{font-weight:800;font-size:150px;line-height:.9;text-transform:uppercase;letter-spacing:1px}
.bar{align-self:flex-start;background:var(--cyan);color:var(--ink);font-weight:800;font-size:60px;padding:10px 26px;text-transform:uppercase;margin-top:12px}
.os{display:flex;gap:16px;margin-top:6px}
.os span{border:3px solid var(--ice);font-weight:700;font-size:40px;padding:4px 18px;letter-spacing:1px}
.stamp{position:absolute;right:70px;bottom:60px;text-align:right}
.stamp b{display:block;font-weight:800;font-size:120px;line-height:1;color:var(--ice);text-shadow:0 4px 18px rgba(0,0,0,.8)}
.stamp i{font-style:normal;font-weight:700;font-size:40px;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.9)}
</style></head><body>
<div class="bg"></div><div class="fade"></div><div class="bottom"></div>
<div class="txt">
  <div class="name">RINGSHADOW</div>
  <h1>One Mac.<br>Three platforms.</h1>
  <div class="bar">Windows + Linux built on AWS</div>
  <div class="os"><span>macOS</span><span>Windows</span><span>Linux</span></div>
</div>
<div class="stamp"><b>~$15</b><i>a month, 2 to 3 builds a week</i></div>
</body></html>
